name: efactura-manager

x-app-environment: &app-environment
    ANAF_CLIENT_ID: ${ANAF_CLIENT_ID:-}
    ANAF_CLIENT_SECRET: ${ANAF_CLIENT_SECRET:-}
    ANAF_REDIRECT_URI: ${ANAF_REDIRECT_URI:-}
    DATABASE_URL: postgres://efactura:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/efactura
    APP_DATABASE_NAME: ${APP_DATABASE_NAME:-efactura}
    DATA_DIR: /app/data
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
    APP_REQUIRE_HTTPS: 'true'
    APP_TLS_PORT: &tls-port ${APP_TLS_PORT:-8765}
    APP_SECRETS_DIR: /app/secrets
    # One-time migration inputs for installations created before app-secrets.
    APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
    ANAF_TOKEN_ENCRYPTION_KEY: ${ANAF_TOKEN_ENCRYPTION_KEY:-}

services:
    database:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: efactura
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: efactura
        ports:
            - "127.0.0.1:55432:5432"
        volumes:
            - database:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U efactura -d efactura"]
            interval: 5s
            timeout: 3s
            retries: 15
        restart: unless-stopped
    web:
        build: .
        image: efactura-manager:development
        environment:
            <<: *app-environment
            APP_TLS_CERT_FILE: /app/tls/localhost.pem
            APP_TLS_KEY_FILE: /app/tls/localhost-key.pem
        ports:
            - target: *tls-port
              published: *tls-port
              host_ip: 127.0.0.1
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - app-secrets:/app/secrets
            - ./.local/tls:/app/tls:ro
        healthcheck:
            test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://127.0.0.1:' + process.env.APP_TLS_PORT + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
            interval: 5s
            timeout: 3s
            retries: 15
        restart: unless-stopped
    worker:
        build: .
        image: efactura-manager:development
        command: ["node", "dist/server/app/worker.js"]
        environment: *app-environment
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - app-secrets:/app/secrets
        restart: unless-stopped
    admin-bootstrap:
        profiles: ["tools"]
        build: .
        image: efactura-manager:development
        command: ["node", "dist/server/app/bootstrap-admin.js"]
        environment:
            <<: *app-environment
            ADMIN_BOOTSTRAP_DIR: /app/admin
        volumes:
            - ./.local/admin:/app/admin
            - app-secrets:/app/secrets
        depends_on:
            database:
                condition: service_healthy

volumes:
    database:
    app-secrets:

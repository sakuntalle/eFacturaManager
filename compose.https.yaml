# Docker Compose v2.20+ HTTPS source-build stack.
include:
    - compose.yaml

services:
    web:
        environment:
            APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
            APP_TLS_PORT: ${APP_TLS_PORT:?Set APP_TLS_PORT in .env}
            APP_TLS_CERT_FILE: /app/tls/localhost.pem
            APP_TLS_KEY_FILE: /app/tls/localhost-key.pem
        ports: !override
            - "127.0.0.1:${APP_TLS_PORT}:${APP_TLS_PORT}"
        healthcheck:
            test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://127.0.0.1:' + process.env.APP_TLS_PORT + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
        volumes:
            - ./.local/tls:/app/tls:ro
    worker:
        environment:
            APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
            APP_TLS_PORT: ${APP_TLS_PORT:?Set APP_TLS_PORT in .env}

# HTTPS stack for the published release image, sharing service settings with compose.yaml.
name: efactura-manager

x-app-image: &app-image ghcr.io/sakuntalle/efactura-manager:${EFACTURA_VERSION:-latest}

services:
    database:
        extends:
            file: compose.yaml
            service: database
    web:
        extends:
            file: compose.yaml
            service: web
        build: !reset null
        image: *app-image
    worker:
        extends:
            file: compose.yaml
            service: worker
        build: !reset null
        image: *app-image
    admin-bootstrap:
        extends:
            file: compose.yaml
            service: admin-bootstrap
        build: !reset null
        image: *app-image

volumes:
    database:
    app-secrets:
